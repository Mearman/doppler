name: Incremental Daily ADS-B Trajectory Pipeline

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Specific date to ingest (YYYY-MM-DD), or leave blank for yesterday'
        required: false
        type: string

concurrency:
  group: adsb-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm run build

      - name: Ingest and Compress Trajectories
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          DATE="${TARGET_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          YEAR="${DATE%%-*}"
          # adsb.lol publishes each UTC day as a release of adsblol/globe_history_YYYY, split into .tar.aa and .tar.ab parts that concatenate to one tar.
          TAG="v${DATE//-/.}-planes-readsb-prod-0"
          BASE="https://github.com/adsblol/globe_history_${YEAR}/releases/download/${TAG}/${TAG}.tar"
          echo "Processing ADS-B trajectories for ${DATE}..."
          # Streams through memory: drops jets and cruise altitudes, simplifies each run to 4D-RDP segments, builds the constellation index and writes the dataset.
          curl --fail --silent --show-error --location "${BASE}.aa" "${BASE}.ab" \
            | node dist-cli/doppler.mjs ingest --input - --out "${DATE}.dataset.json"
          ls -l "${DATE}.dataset.json"
