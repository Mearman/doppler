# This is a single-package repo, not a real pnpm workspace: packages is deliberately empty. The file exists to carry pnpm settings.
packages: []
# Every dependency add or update writes an exact version, never a range.
saveExact: true

minimumReleaseAgeExclude:
  - "@exadev/build-identity"
  - "@exadev/eslint-config"
  - "trilean"
  - "trilean-regex"
  - "crossmap"

minimumReleaseAge: 10080

# workerd is the local Workers runtime used by `wrangler dev`; `wrangler deploy` does not need its install script, so it stays blocked.
allowBuilds:
  esbuild: true
  workerd: false
